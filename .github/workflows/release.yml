name: Release gateway image

# Fires when a version tag (v0.3.0, v0.4.0, ...) is pushed.
#
# Builds Dockerfile.gateway (the GPU-less gateway / landing binary) and pushes
# it to GHCR as ghcr.io/deepbluedynamics/shivvr-gateway with semver + :latest
# tags. If the repo has DOCKER_USERNAME / DOCKER_TOKEN secrets, the same image
# is also pushed to Docker Hub as deepbluedynamics/shivvr-gateway.
#
# The CUDA app image (Dockerfile) is NOT built here: it copies ~2.2 GB of
# gitignored ONNX models from models/, so it stays on Cloud Build via
# deploy.sh, which tags gcr.io/<project>/shivvr with the same version.
#
# The version is read from Cargo.toml and must match the tag (v<version>).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          CARGO_VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "v${CARGO_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub credentials present?
        id: hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "${DOCKER_USERNAME}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DOCKER_USERNAME secret not set; skipping Docker Hub push"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/deepbluedynamics/shivvr-gateway
            ${{ steps.hub.outputs.enabled == 'true' && 'deepbluedynamics/shivvr-gateway' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
